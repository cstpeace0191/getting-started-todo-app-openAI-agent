# Values for asia-northeast3-docker.pkg.dev/ssu-agent-vertex-509708/suntaechung-repo/getting-started-todo-app-openai-agent
backend:
  serviceType: LoadBalancer
  servicePort: 80
  repository:
    image: asia-northeast3-docker.pkg.dev/ssu-agent-vertex-509708/suntaechung-repo/getting-started-todo-app-openai-agent
    tag: prod
  replicas: 2
  nodeSelector: {}
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"
  imagePullPolicy: Always
  serviceAccount: ""

postgres:
  repository:
    image: postgres
    tag: "17"
  persistence:
    todo_postgres_data:
      storageClass: standard-rwo
      size: 10Gi
      accessMode:
        - ReadWriteOnce
      enabled: true
  replicas: 1
  nodeSelector: {}
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  imagePullPolicy: IfNotPresent
  serviceAccount: ""

pullSecrets: []
