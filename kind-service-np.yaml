apiVersion: v1
kind: Service
metadata:
  name: todo-backend-np
  labels:
    app.kubernetes.io/name: getting-started-todo-app-openai-agent
    app.kubernetes.io/component: backend
spec:
  type: NodePort
  selector:
    app: todo-backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080

# [Kind vs GKE 차이점]
# - Kind: kind-config.yaml의 extraPortMappings (hostPort: 80 -> containerPort: 30080) 덕분에 http://localhost로 바로 접근 가능
# - GKE: GKE 노드의 외부 IP(External IP)로 직접 접근하려면 GCP 방화벽에서 30080 포트를 열어야 함:
#   $ gcloud compute firewall-rules create allow-gke-nodeport-30080 --allow tcp:30080 --target-tags <GKE-NODE-TAG>
#   * 실무 GKE에서는 NodePort 대신 GKE Ingress 또는 type: LoadBalancer (GKE-service-lb.yaml) 사용 권장
# - 외부 접속 테스트 시에는 kubectl port-forward 명령어를 활용할 수 있습니다:
#   $ kubectl port-forward svc/todo-backend-np 8081:80